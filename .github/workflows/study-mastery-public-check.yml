name: Study Mastery - diagnostico publico
on:
  push:
    branches: [diagnostico/study-mastery-pages]
permissions:
  contents: read
jobs:
  public-check:
    if: ${{ !contains(github.event.head_commit.message, 'smoke-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir DNS, HTTP e assets publicados
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import dns from 'node:dns/promises';
          const bases = ['https://study-mastery.pages.dev/', 'https://5c2aaa12.study-mastery.pages.dev/', 'https://tiago-u12.github.io/projeto-faculdade/study-mastery/'];
          let failures = 0;
          for (const base of bases) {
            try {
              console.log(JSON.stringify({base,dns:await dns.lookup(new URL(base).hostname,{all:true})}));
              const r=await fetch(base,{signal:AbortSignal.timeout(20000)});
              const html=await r.text();
              const assets=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(m=>new URL(m[1],r.url).href);
              console.log(JSON.stringify({base,url:r.url,status:r.status,type:r.headers.get('content-type'),server:r.headers.get('server'),cfRay:r.headers.get('cf-ray'),title:html.match(/<title>(.*?)<\/title>/s)?.[1],assets}));
              if(!r.ok || !html.includes('Study Mastery') || !assets.length) failures++;
              for(const url of [...assets,new URL('index.html',base).href,new URL('sw.js',base).href,new URL('manifest.webmanifest',base).href]){
                try{
                  const x=await fetch(url,{signal:AbortSignal.timeout(20000)});
                  const text=await x.text();
                  console.log(JSON.stringify({resource:url,finalUrl:x.url,redirected:x.redirected,status:x.status,type:x.headers.get('content-type'),bytes:text.length,rawMarkers:/__SM_VERSION__|__SM_ASSETS__/.test(text),hasVersion051:url.endsWith('.js')?text.includes('0.5.1'):undefined}));
                  if(!x.ok)failures++;
                  if(url.endsWith('sw.js')&&(/__SM_VERSION__|__SM_ASSETS__/.test(text)||!text.includes('study-mastery-')))failures++;
                }catch(e){failures++;console.log(JSON.stringify({resource:url,error:String(e),cause:String(e.cause)}));}
              }
            }catch(e){failures++;console.log(JSON.stringify({base,error:String(e),cause:String(e.cause)}));}
          }
          console.log(JSON.stringify({httpFailures:failures}));
          process.exitCode=failures?1:0;
          NODE
      - name: Instalar dependencias existentes do Study Mastery
        working-directory: study-mastery
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar verificadores exigidos pela suite
        working-directory: study-mastery
        run: |
          python -m pip install sympy==1.14.0 mpmath==1.3.0
          npm run sandbox:install
      - name: Typecheck e testes de unidade
        working-directory: study-mastery
        run: |
          npm run typecheck
          npm test
          npm run test:pwa
      - name: Build para reproducao local
        working-directory: study-mastery
        run: npm run build
      - name: Reproduzir navegacao com redirecionamento canonico
        working-directory: study-mastery
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run e2e:redirects
      - name: Verificar offline e fluxo existente
        working-directory: study-mastery
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm run e2e:offline
          npm run e2e
      - name: Homologacao completa com canonicalizacao Cloudflare
        working-directory: study-mastery
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          HOMOLOG_LAYOUT: cloudflare
        run: npm run e2e:homologacao
      - name: Homologacao completa GitHub Pages
        working-directory: study-mastery
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run e2e:homologacao
  public-site:
    if: ${{ contains(github.event.head_commit.message, 'smoke-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STUDY_SMOKE_URL: https://study-mastery.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias existentes
        working-directory: study-mastery
        run: npm ci --no-audit --no-fund
      - name: Testar URL real com recarga online e offline
        working-directory: study-mastery
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          try{
          for(const base of [process.env.STUDY_SMOKE_URL,'https://tiago-u12.github.io/projeto-faculdade/study-mastery/']){
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'allow'});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          const r=await page.goto(base,{waitUntil:'domcontentloaded'});
          await page.getByRole('heading',{name:/Aprenda mais/}).waitFor();
          assert.equal(r.status(),200);
          assert.ok((await page.locator('footer').innerText()).includes('0.5.2'));
          await page.waitForFunction(()=>!!navigator.serviceWorker.controller);
          const cacheRows=await page.evaluate(async()=>{
           const rows=[];
           for(const name of await caches.keys()){
            const c=await caches.open(name);
            for(const key of await c.keys()){
             if(key.url.endsWith('/')||key.url.endsWith('index.html')){
              const r=await c.match(key);rows.push({key:key.url,url:r.url,redirected:r.redirected});
             }
            }
           }
           return rows;
          });
          console.log(JSON.stringify({url:page.url(),title:await page.title(),version:await page.locator('footer').innerText(),cachedDocuments:cacheRows}));
          await page.reload();
          await page.getByRole('heading',{name:/Aprenda mais/}).waitFor();
          await page.getByRole('button',{name:'Começar a estudar'}).click();
          await page.getByRole('heading',{name:/Configure seu/}).waitFor();
          await page.locator('label.seg-btn',{hasText:/^\s*5\s*$/}).click();
          await page.getByRole('button',{name:/Iniciar sessão/}).click();
          await page.getByRole('heading',{name:'Questão 1 de 5',exact:true}).waitFor();
          await page.keyboard.press('1');
          await page.locator('.feedback').waitFor();
          const state=await page.evaluate(()=>localStorage.getItem('study-mastery:state:v1'));
          await page.reload();
          await page.getByRole('heading',{name:'Questão 1 de 5',exact:true}).waitFor();
          await page.locator('.feedback').waitFor();
          await context.setOffline(true);
          await page.reload();
          await page.getByRole('heading',{name:'Questão 1 de 5',exact:true}).waitFor();
          await page.locator('.feedback').waitFor();
          assert.equal(await page.evaluate(()=>localStorage.getItem('study-mastery:state:v1')),state);
          assert.deepEqual(errors,[]);
          console.log(JSON.stringify({base,onlineReload:true,quizAnswered:true,offlineReload:true,sessionPreserved:true,pageErrors:errors}));
          await context.close();
          }
          }finally{await browser.close();}
          NODE
