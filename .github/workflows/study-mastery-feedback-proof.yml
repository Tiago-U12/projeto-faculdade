name: Conferir teste real dos feedbacks

on:
  push:
    branches: [feat/feedback-inbox]
    paths:
      - '.github/workflows/study-mastery-feedback-proof.yml'
      - 'study-mastery/docs/feedback-preview-proof.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Testar automação sem credenciais
        working-directory: study-mastery
        run: node tests/automation/cloudflare-feedback.test.mjs
      - name: Conferir que o aplicativo continua igual ao preview testado
        run: |
          tested=$(node -p "JSON.parse(require('fs').readFileSync('study-mastery/docs/feedback-preview-proof.json')).commitSha")
          git diff --exit-code "$tested" HEAD -- study-mastery ':(exclude)study-mastery/tools' ':(exclude)study-mastery/tests' ':(exclude)study-mastery/docs'
      - name: Conferir protocolo no D1 sem divulgar o relato ou as imagens
        working-directory: study-mastery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3428838cbf6d8733de1ef6cc07bc4ebd' }}
          FEEDBACK_ADMIN_TOKEN_PRODUCTION: ${{ secrets.FEEDBACK_ADMIN_TOKEN_PRODUCTION }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { cloudflareAPI, provision, checkProductionProof } from './tools/cloudflare-feedback.mjs';
          const env = process.env;
          const proof = JSON.parse(readFileSync('docs/feedback-preview-proof.json', 'utf8'));
          const options = { ...proof, accountId: env.CLOUDFLARE_ACCOUNT_ID, target: 'preview', apply: false, confirmProduction: 'PUBLICAR_FEEDBACK', reviewed: true };
          const report = line => {
            console.log(line);
            appendFileSync(env.GITHUB_STEP_SUMMARY, line + '\n\n');
          };
          try {
            const api = cloudflareAPI(env.CLOUDFLARE_API_TOKEN);
            await provision(options, { api }); // Apenas GET; nenhuma configuração é aplicada.
            const prefix = `/accounts/${options.accountId}`;
            const project = await api('GET', `${prefix}/pages/projects/study-mastery`);
            await checkProductionProof(options, api, prefix, project); // GET do deploy e SELECT do protocolo.
            report('Teste real confirmado: commit e ambiente corretos, banco separado, protocolo posterior ao deploy, versão do app, print presente e status Em análise.');
            report(`Chave administrativa de produção: ${/^[\x21-\x7e]{32,256}$/.test(env.FEEDBACK_ADMIN_TOKEN_PRODUCTION ?? '') ? 'formato válido' : 'ausente ou formato inválido'}.`);
            report('Somente leitura. Produção não foi configurada ou publicada por este workflow.');
          } catch (error) {
            report('A prova do preview não foi confirmada. ' + error.message);
            process.exitCode = 1;
          }
          NODE
