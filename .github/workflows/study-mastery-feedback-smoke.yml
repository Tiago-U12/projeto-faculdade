name: Verificar feedbacks publicados

on:
  push:
    branches: [main]
    paths:
      - 'study-mastery/**'
      - '.github/workflows/study-mastery-feedback-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-mastery-feedback-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Aguardar o commit no Pages e conferir API pública e autorização
        working-directory: study-mastery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3428838cbf6d8733de1ef6cc07bc4ebd' }}
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN_PRODUCTION }}
        run: |
          node --input-type=module <<'NODE'
          import { cloudflareAPI } from './tools/cloudflare-feedback.mjs';
          const env = process.env, api = cloudflareAPI(env.CLOUDFLARE_API_TOKEN);
          const base = 'https://study-mastery.pages.dev';
          const need = (ok, message) => { if (!ok) throw new Error(message); };
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          const get = (path, headers = {}) => fetch(base + path, { headers, redirect: 'error', cache: 'no-store', signal: AbortSignal.timeout(15000) });
          try {
            need(/^[a-f0-9]{32}$/i.test(env.CLOUDFLARE_ACCOUNT_ID), 'ID da conta inválido.');
            need(/^[\x21-\x7e]{32,256}$/.test(env.FEEDBACK_ADMIN_TOKEN ?? ''), 'Chave de produção ausente/inválida.');
            let ready = false;
            for (let attempt = 0; attempt < 36; attempt++) {
              const deployments = await api('GET', `/accounts/${env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/study-mastery/deployments?env=production&per_page=25&page=1`);
              const current = deployments.find(d => d.environment === 'production' && d.deployment_trigger?.metadata?.commit_hash === env.GITHUB_SHA);
              if (current?.latest_stage?.status === 'success') { ready = true; break; }
              need(current?.latest_stage?.status !== 'failure', 'O deploy de produção deste commit falhou. Confira o Pages.');
              if (attempt % 6 === 0) console.log('Aguardando o deploy de produção do commit atual.');
              await pause(10000);
            }
            need(ready, 'Deploy deste commit não foi confirmado no prazo; nenhuma alteração foi feita por esta verificação.');
            const home = await get('/');
            need(home.status === 200 && /text\/html/i.test(home.headers.get('Content-Type') ?? ''), 'Página inicial pública não confirmada.');
            console.log('Página inicial pública: HTTP 200.');
            const config = await get('/api/feedback?action=config');
            need(config.status === 200 && /application\/json/i.test(config.headers.get('Content-Type') ?? ''), 'Configuração pública da API não retornou JSON.');
            const settings = await config.json();
            need(settings.enabled === true && typeof settings.siteKey === 'string' && settings.siteKey.length > 0, 'Recebimento não está habilitado em produção.');
            console.log('Configuração pública: recebimento habilitado e site key presente.');
            const anonymous = await get('/api/feedback?action=list');
            need(anonymous.status === 401, 'Administração não recusou acesso sem chave.');
            const wrong = await get('/api/feedback?action=list', { Authorization: 'Bearer deliberately-invalid-key-for-smoke-check' });
            need(wrong.status === 401, 'Administração não recusou chave inválida.');
            console.log('Administração: sem chave e com chave inválida retornam HTTP 401.');
            const admin = await get('/api/feedback?action=list', { Authorization: `Bearer ${env.FEEDBACK_ADMIN_TOKEN}` });
            need(admin.status === 200 && /application\/json/i.test(admin.headers.get('Content-Type') ?? ''), 'Chave administrativa de produção não foi aceita.');
            need(/no-store/i.test(admin.headers.get('Cache-Control') ?? ''), 'Resposta administrativa sem no-store.');
            const inbox = await admin.json().catch(() => { throw new Error('Resposta administrativa não contém JSON válido.'); });
            need(Array.isArray(inbox.items), 'Formato da caixa administrativa não confirmado.');
            console.log('Administração autenticada: HTTP 200, formato correto e no-store. Conteúdo dos relatos não registrado.');
            console.log('Publicação deste commit e integração da API confirmadas. Captcha/envio foram testados no preview; nenhum relato foi inserido por este smoke test.');
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }
          NODE
