
name: Publicar TROCA Ticket

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TrocaTicket/package-lock.json

      - name: Instalar dependencias
        working-directory: TrocaTicket
        run: npm ci

      - name: Gerar site
        working-directory: TrocaTicket
        run: npm run build

      - name: Gerar Aysha Park
        working-directory: aysha-park
        run: npm run build

      - name: Incluir Aysha Park na publicacao
        run: |
          mkdir -p TrocaTicket/dist/aysha-park
          cp aysha-park/dist/index.html aysha-park/vendor/PHASER-LICENSE.md TrocaTicket/dist/aysha-park/

      - name: Gerar Dungeon Cooked
        working-directory: dungeon-cooked
        run: npm run build

      - name: Incluir Dungeon Cooked na publicacao
        run: |
          mkdir -p TrocaTicket/dist/dungeon-cooked
          cp dungeon-cooked/dist/index.html TrocaTicket/dist/dungeon-cooked/

      - name: Instalar dependencias do Study Mastery
        if: vars.PUBLICAR_STUDY_MASTERY == 'true'
        working-directory: study-mastery
        run: npm ci

      - name: Gerar Study Mastery
        if: vars.PUBLICAR_STUDY_MASTERY == 'true'
        working-directory: study-mastery
        # contas opcionais: URL e chave PUBLICÁVEL do Supabase (públicas por natureza). Sem as variáveis, o app
        # funciona como antes, sem contas. Nunca coloque a chave secreta (service role) aqui.
        env:
          VITE_SUPABASE_URL: ${{ vars.STUDY_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STUDY_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Incluir Study Mastery na publicacao
        if: vars.PUBLICAR_STUDY_MASTERY == 'true'
        run: |
          mkdir -p TrocaTicket/dist/study-mastery
          cp -a study-mastery/dist/. TrocaTicket/dist/study-mastery/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: TrocaTicket/dist

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4


